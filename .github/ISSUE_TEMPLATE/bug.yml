name: Bug report
description: Something in a Totative tool doesn't work as documented.
body:
  - type: markdown
    attributes:
      value: If this is a security problem, stop here and use **Report a vulnerability** on the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag or commit you're running.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, architecture, and anything else that might matter.
